<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Consolas','Menlo',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1116"/>
      <stop offset="55%" stop-color="#14232A"/>
      <stop offset="100%" stop-color="#1B2E33"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182029"/>
      <stop offset="100%" stop-color="#0F151B"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#4FD1C5"/>
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B7FF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B7FF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette3" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="sheenGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow3" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clipAll3"><rect width="1200" height="300"/></clipPath>

    <style>
      @keyframes pulseGlow3 {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.07); }
      }
      @keyframes winBob {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-6px); }
      }
      @keyframes dashFlow3 { to { stroke-dashoffset: -18; } }
      @keyframes currentPulse {
        0%, 100% { opacity: 1;   r: 6; }
        50%      { opacity: 0.5; r: 8; }
      }
      @keyframes sheenSweep3 {
        0%   { transform: translateX(-140%); }
        100% { transform: translateX(140%); }
      }
      @keyframes navActive {
        0%, 28%  { transform: translateX(-112px); width: 46px; }
        33%, 61% { transform: translateX(-58px);  width: 52px; }
        66%, 94% { transform: translateX(-4px);   width: 62px; }
        100%     { transform: translateX(-112px); width: 46px; }
      }
      @keyframes cardGlow {
        0%, 22%, 100% { opacity: 0; }
        8%            { opacity: 1; }
      }
      .glow-outer3 { transform-origin: 955px 148px; animation: pulseGlow3 4.6s ease-in-out infinite; }
      .glow-outer3b{ transform-origin: 955px 148px; animation: pulseGlow3 3.8s ease-in-out infinite 0.5s; }
      .window      { animation: winBob 5.2s ease-in-out infinite; }
      .version-line{ stroke-dasharray: 4 5; animation: dashFlow3 2.4s linear infinite; }
      .current-node{ animation: currentPulse 1.7s ease-in-out infinite; }
      .sheen-bar3  { animation: sheenSweep3 7.5s linear infinite; }
      .nav-underline{ animation: navActive 3.6s ease-in-out infinite; }
      .card-glow-a { opacity:0; animation: cardGlow 3.6s ease-in-out infinite; }
      .card-glow-b { opacity:0; animation: cardGlow 3.6s ease-in-out infinite 1.2s; }
      .card-glow-c { opacity:0; animation: cardGlow 3.6s ease-in-out infinite 2.4s; }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg3)"/>

  <g clip-path="url(#clipAll3)">
    <rect class="sheen-bar3" x="-200" y="-100" width="260" height="600" fill="url(#sheenGrad3)" transform="rotate(20 600 150)"/>
  </g>

  <circle class="glow-outer3" cx="955" cy="148" r="185" fill="url(#glow3)"/>
  <circle class="glow-outer3b" cx="955" cy="148" r="130" fill="url(#glow3b)"/>

  <!-- browser / editor window -->
  <g transform="translate(955,148)">
  <g class="window" filter="url(#softShadow3)">
    <rect x="-130" y="-78" width="260" height="156" rx="12" fill="url(#winGrad)" stroke="#3A4753" stroke-width="1"/>
    <path d="M -130 -66 a12 12 0 0 1 12 -12 h236 a12 12 0 0 1 12 12 v14 h-260 z" fill="#141B22"/>
    <circle cx="-112" cy="-63" r="5" fill="#FF5F57"/>
    <circle cx="-96" cy="-63" r="5" fill="#FEBC2E"/>
    <circle cx="-80" cy="-63" r="5" fill="#28C840"/>
    <rect x="-38" y="-69" width="150" height="13" rx="6.5" fill="#20293300" stroke="#3A4753" stroke-width="1"/>
    <text x="37" y="-59.5" font-size="8" fill="#7E8FA0" text-anchor="middle">jjhernan-dev.github.io</text>

    <!-- identidad: avatar + nombre -->
    <circle cx="-108" cy="-38" r="10" fill="url(#avatarGrad)"/>
    <text x="-108" y="-34.5" font-size="8" fill="#0F151B" font-weight="700" text-anchor="middle">JJ</text>
    <text x="-92" y="-41" font-size="11" fill="#EAF1F5" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Juan Jesús</text>
    <text x="-92" y="-30" font-size="8" fill="#7E8FA0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">Dev · Ciberseguridad</text>

    <!-- navegación con indicador activo animado -->
    <g font-size="9" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#9AAAB6">
      <text x="-112" y="-13">Sobre mí</text>
      <text x="-58" y="-13" fill="#EAF1F5">Proyectos</text>
      <text x="-4" y="-13">Certificados</text>
    </g>
    <rect class="nav-underline" x="0" y="-8" width="46" height="2" rx="1" fill="#6EE7E0"/>

    <!-- tarjetas de proyecto -->
    <g>
      <rect x="-112" y="0" width="46" height="26" rx="4" fill="#141B22" stroke="#2E3A44" stroke-width="1"/>
      <rect x="-112" y="0" width="46" height="4" rx="2" fill="#A78BFA"/>
      <rect x="-107" y="10" width="28" height="2.5" rx="1.2" fill="#2E3A44"/>
      <rect x="-107" y="16" width="20" height="2.5" rx="1.2" fill="#2E3A44"/>
      <rect class="card-glow-a" x="-112" y="0" width="46" height="26" rx="4" fill="none" stroke="#A78BFA" stroke-width="1.5"/>

      <rect x="-58" y="0" width="46" height="26" rx="4" fill="#141B22" stroke="#2E3A44" stroke-width="1"/>
      <rect x="-58" y="0" width="46" height="4" rx="2" fill="#4FD1C5"/>
      <rect x="-53" y="10" width="28" height="2.5" rx="1.2" fill="#2E3A44"/>
      <rect x="-53" y="16" width="20" height="2.5" rx="1.2" fill="#2E3A44"/>
      <rect class="card-glow-b" x="-58" y="0" width="46" height="26" rx="4" fill="none" stroke="#4FD1C5" stroke-width="1.5"/>

      <rect x="-4" y="0" width="46" height="26" rx="4" fill="#141B22" stroke="#2E3A44" stroke-width="1"/>
      <rect x="-4" y="0" width="46" height="4" rx="2" fill="#FF9466"/>
      <rect x="1" y="10" width="28" height="2.5" rx="1.2" fill="#2E3A44"/>
      <rect x="1" y="16" width="20" height="2.5" rx="1.2" fill="#2E3A44"/>
      <rect class="card-glow-c" x="-4" y="0" width="46" height="26" rx="4" fill="none" stroke="#FF9466" stroke-width="1.5"/>
    </g>

    <!-- version timeline -->
    <g transform="translate(0,46)">
      <path class="version-line" d="M -90 0 L 90 0" stroke="#3A4753" stroke-width="2" fill="none"/>
      <g font-size="9" fill="#7E8FA0" text-anchor="middle">
        <circle cx="-90" cy="0" r="4" fill="#4FD1C5"/>
        <text x="-90" y="18">v1</text>
        <circle cx="-30" cy="0" r="4" fill="#4FD1C5"/>
        <text x="-30" y="18">v2</text>
        <circle cx="30" cy="0" r="4" fill="#4FD1C5"/>
        <text x="30" y="18">v3</text>
      </g>
      <circle class="current-node" cx="90" cy="0" r="6" fill="#A78BFA"/>
      <text x="90" y="18" font-size="9" fill="#D7CFFA" text-anchor="middle" font-weight="700">v4</text>
    </g>
  </g>
  </g>

  <!-- left text block -->
  <g fill="#EAF1F5">
    <text x="70" y="108" font-size="40" font-weight="700" letter-spacing="0.3">Portfolio</text>
  </g>
  <text x="70" y="138" font-size="15.5" fill="#9AAAB6" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    Juan Jesús González Hernández · desarrollo &amp; ciberseguridad defensiva
  </text>
  <text x="70" y="160" font-size="13" fill="#6B7A8A" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    Formación, certificaciones y proyectos — en constante evolución
  </text>

  <!-- tech badges -->
  <g font-size="13" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="600">
    <g transform="translate(70,190)">
      <rect width="84" height="30" rx="15" fill="none" stroke="#E44D26" stroke-width="1.4"/>
      <text x="42" y="19" fill="#E44D26" text-anchor="middle">HTML5</text>
    </g>
    <g transform="translate(166,190)">
      <rect width="78" height="30" rx="15" fill="none" stroke="#2E9FE0" stroke-width="1.4"/>
      <text x="39" y="19" fill="#2E9FE0" text-anchor="middle">CSS3</text>
    </g>
    <g transform="translate(256,190)">
      <rect width="130" height="30" rx="15" fill="none" stroke="#E9D65C" stroke-width="1.4"/>
      <text x="65" y="19" fill="#E9D65C" text-anchor="middle">JavaScript</text>
    </g>
    <g transform="translate(398,190)">
      <rect width="118" height="30" rx="15" fill="none" stroke="#4FD1C5" stroke-width="1.4"/>
      <text x="59" y="19" fill="#4FD1C5" text-anchor="middle">SVG inline</text>
    </g>
  </g>

  <text x="70" y="256" font-size="13" fill="#5F6E7C" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    jjhernan-dev.github.io
  </text>

  <rect width="1200" height="300" fill="url(#vignette3)" pointer-events="none"/>
</svg>
